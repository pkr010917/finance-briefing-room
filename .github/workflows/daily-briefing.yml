# 매일 아침 7시(한국시간)에 브리핑을 자동 갱신하는 GitHub Actions 설정
name: daily-briefing

on:
  schedule:
    - cron: "0 22 * * *" # UTC 22:00 = 한국시간 아침 7:00
  workflow_dispatch: # Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능

permissions:
  contents: write # 갱신된 data.json을 저장소에 커밋하기 위해 필요

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Update briefing
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEFING_MODEL: ${{ vars.BRIEFING_MODEL }}
        run: python scripts/update_briefing.py

      - name: Commit and push
        run: |
          git config user.name "briefing-bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "🤖 자동 브리핑 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          git push
