<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>금융 브리핑 룸</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 상단: 최소한의 정보만 -->
  <header class="top">
    <div class="top__brand">
      <h1 class="top__title">금융 브리핑 룸</h1>
      <p class="top__meta" id="meta"></p>
    </div>
    <div class="top__side">
      <div class="hot" id="hot" aria-label="지금 활발한 트렌드"></div>
      <p class="legend"><span class="legend__dot"></span>오늘 새로 연결된 뉴스</p>
    </div>
  </header>

  <!-- 중심: 트렌드 그래프 -->
  <main class="stage">
    <svg id="graph" aria-label="트렌드 그래프"></svg>
    <div class="tooltip" id="tooltip" hidden></div>
  </main>

  <!-- 트렌드 선택 시 나타나는 패널 -->
  <aside class="panel" id="panel" hidden>
    <button class="panel__close" id="panel-close" aria-label="닫기">&times;</button>
    <p class="panel__category" id="panel-category"></p>
    <h2 class="panel__title" id="panel-title"></h2>
    <p class="panel__since" id="panel-since"></p>
    <p class="panel__desc" id="panel-desc"></p>
    <h3 class="panel__heading">연결된 뉴스</h3>
    <ul class="panel__articles" id="panel-articles"></ul>
    <a class="panel__more" id="panel-more" target="_blank" rel="noopener">네이버 뉴스에서 더 찾아보기</a>
  </aside>

  <footer class="foot" id="foot"></footer>

  <script src="script.js"></script>
</body>
</html>
