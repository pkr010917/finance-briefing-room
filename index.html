<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>금융 브리핑 룸</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <!-- ?v= 는 캐시 무효화용 — style.css나 script.js를 고치면 두 곳 모두 숫자를 올릴 것.
       안 올리면 방문자가 옛 JS + 새 HTML 조합으로 깨진 화면을 볼 수 있다 (2026-08-29 실제 발생) -->
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <div class="wrap">
    <!-- 상단: 최소한의 정보만 -->
    <header class="top">
      <h1 class="top__title">금융 브리핑 룸</h1>
      <p class="top__meta" id="meta"></p>
    </header>

    <!-- 최신 브리핑: 그날 텔레그램에서 본 뉴스가 어떤 테마였는지 -->
    <section class="board" id="board">
      <div class="board__head">
        <h2 class="board__title" id="board-title"></h2>
        <p class="board__sub" id="board-sub"></p>
      </div>
      <div class="board__grid" id="board-grid"></div>
    </section>

    <!-- 모든 트렌드: 축적된 흐름 전체 -->
    <section class="all">
      <h2 class="all__title">모든 트렌드</h2>
      <div class="all__list" id="trend-list"></div>
    </section>

    <footer class="foot" id="foot"></footer>
  </div>

  <!-- 트렌드 선택 시 나타나는 패널 -->
  <aside class="panel" id="panel" hidden>
    <button class="panel__close" id="panel-close" aria-label="닫기">&times;</button>
    <p class="panel__category" id="panel-category"></p>
    <h2 class="panel__title" id="panel-title"></h2>
    <p class="panel__since" id="panel-since"></p>
    <p class="panel__desc" id="panel-desc"></p>
    <h3 class="panel__heading">연결된 뉴스</h3>
    <ul class="panel__articles" id="panel-articles"></ul>
    <a class="panel__more" id="panel-more" target="_blank" rel="noopener">네이버 뉴스에서 더 찾아보기</a>
  </aside>

  <script src="script.js?v=3"></script>
</body>
</html>
